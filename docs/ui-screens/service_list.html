<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Services Management List</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-switch:checked + div {
            background-color: #136dec;
        }
        .material-switch:checked + div > span {
            transform: translateX(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen pb-24">
<!-- Top App Bar (iOS style) -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 h-16 flex items-center justify-between">
<button class="flex items-center justify-center p-2 text-primary">
<span class="material-symbols-outlined text-[28px]">arrow_back_ios</span>
</button>
<h1 class="text-lg font-semibold absolute left-1/2 -translate-x-1/2">Services</h1>
<button class="flex items-center justify-center p-2 text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-[24px]">search</span>
</button>
</header>
<main class="max-w-md mx-auto p-4 space-y-3">
<!-- Active Service Card: General Consultation -->
<div class="bg-white dark:bg-slate-900 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold text-sm shrink-0">
                GC
            </div>
<div class="flex-1 min-w-0">
<h3 class="font-semibold text-slate-900 dark:text-slate-100 truncate">General Consultation</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">30 mins • 5 mins margin</p>
</div>
<div class="flex items-center gap-2">
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only material-switch peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
<button class="p-1 text-slate-400">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
<!-- Active Service Card: Blood Test -->
<div class="bg-white dark:bg-slate-900 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-600 dark:text-emerald-400 font-bold text-sm shrink-0">
                BT
            </div>
<div class="flex-1 min-w-0">
<h3 class="font-semibold text-slate-900 dark:text-slate-100 truncate">Blood Test</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">15 mins • 10 mins margin</p>
</div>
<div class="flex items-center gap-2">
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only material-switch peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
<button class="p-1 text-slate-400">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
<!-- Inactive Service Card: Follow-up Visit -->
<div class="bg-white dark:bg-slate-900 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 flex items-center gap-4 opacity-60">
<div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 font-bold text-sm shrink-0">
                FV
            </div>
<div class="flex-1 min-w-0">
<h3 class="font-semibold text-slate-900 dark:text-slate-100 truncate">Follow-up Visit</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">20 mins • 5 mins margin</p>
</div>
<div class="flex items-center gap-2">
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only material-switch peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
<button class="p-1 text-slate-400">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
<!-- Active Service Card: Pediatric Check -->
<div class="bg-white dark:bg-slate-900 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400 font-bold text-sm shrink-0">
                PC
            </div>
<div class="flex-1 min-w-0">
<h3 class="font-semibold text-slate-900 dark:text-slate-100 truncate">Pediatric Check</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">45 mins • 15 mins margin</p>
</div>
<div class="flex items-center gap-2">
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only material-switch peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
<button class="p-1 text-slate-400">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-6 bg-primary text-white flex items-center gap-2 px-6 py-4 rounded-2xl shadow-lg shadow-primary/30 hover:bg-primary/90 transition-all active:scale-95">
<span class="material-symbols-outlined font-bold">add</span>
<span class="font-semibold">Add Service</span>
</button>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 px-2 py-2 flex justify-around items-center z-50">
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-600" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">list_alt</span>
<span class="text-[10px] font-medium">Services</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-600" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<span class="text-[10px] font-medium">Bookings</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-600" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-medium">Settings</span>
</a>
</nav>
</body></html>
